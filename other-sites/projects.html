<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects by tmatejcek – this website, calculator, snake game, and alarm clock.">
    <title>Projects | tmatejcek</title>
    <link rel="stylesheet" href="/assets/css/font.css">
    <link rel="stylesheet" href="/assets/css/global.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar" id="main-nav">
        <a href="/index.html" class="logo">Studik</a>
        <ul class="nav-links">
            <li><a href="/other-sites/about.html" data-translations="nav.about">About</a></li>
            <li><a href="/other-sites/projects.html" data-translations="nav.projects">Projects</a></li>
            <li><a href="/other-sites/skills.html" data-translations="nav.skills">Skills</a></li>
        </ul>
        <div class="lang-toggle">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="cz">CZ</button>
        </div>
    </nav>

    <main class="page-wrapper">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="/index.html" data-translations="breadcrumb.home">Home</a>
            <span class="separator">/</span>
            <span class="current" data-translations="breadcrumb.projects">Projects</span>
        </div>

        <!-- Page header -->
        <div class="page-header reveal">
            <h1 data-translations="projects.title">Projects</h1>
            <p data-translations="projects.subtitle">Things I've built and am working on — more coming soon!</p>
        </div>

        <hr class="divider">

        <!-- Project cards -->
        <div class="card-grid reveal">

            <div class="card reveal">
                <h2 style="margin-top: 0.8rem;" data-translations="proj.website.title">Portfolio website</h2>
                <p data-translations="proj.website.desc">My personal portfolio site, built from scratch with HTML, CSS,
                    JavaScript and the use of AI.</p>
                <a href="https://tmatejcek.github.io/" style="margin-top: 0.8rem; display: inline-block;"
                    data-translations="proj.website.link">
                    Visit →
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="footer" id="footer" data-translations="footer">
        &copy; 2025 Studik. Built with care.
    </footer>

    <!-- Scroll reveal script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reveals = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

            reveals.forEach(el => observer.observe(el));
        });
    </script>
    <script src="/assets/js/translations.js"></script>

</body>

</html>
